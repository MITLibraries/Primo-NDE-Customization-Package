name: Build NDE customization package

on:
  workflow_dispatch:
    inputs:
      view_id:
        description: 'View ID (used to name the output zip)'
        required: true
        default: 'NDE'

permissions:
   contents: read


jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build NDE customization package
        run: npm run build
        env:
          VIEW_ID: ${{ inputs.view_id }}

      - name: Upload NDE customization package
        uses: actions/upload-artifact@v7
        with:
          name: custom-module-dist
          path: dist/01MIT_INST-${{ inputs.view_id }}.zip