name: Stage Build for NDE customization package

on:
  workflow_dispatch:
  push:
    branches:
      - mit-main

permissions:
  contents: read


jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build NDE customization package
        env:
          # Setting VIEW_ID here overrides the value in build-settings.env at build time.
          # dotenv does not overwrite variables already present in process.env (override: false by default),
          # so shell/CI env vars always take precedence over the .env file.
          VIEW_ID: NDE_STAGE
        run: npm run build
        
      - name: Upload NDE customization package
        # postbuild.js includes BUILD_ID in the zip filename, but not the enclosed folder.
        # archive: false uploads that file as-is without re-zipping it; the artifact name is
        # taken from the filename.
        uses: actions/upload-artifact@v7
        with:
          path: dist/01MIT_INST-NDE_STAGE-${{ env.BUILD_ID }}.zip
          archive: false
          if-no-files-found: error