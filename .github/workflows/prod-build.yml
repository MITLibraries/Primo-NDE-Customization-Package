name: Prod Build for NDE customization package

on:
  release:
    types: [published]

permissions:
  contents: write


jobs:
  build:
    if: github.event.release.target_commitish == 'mit-main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build NDE customization package
        env:
          # Setting VIEW_ID here overrides the value in build-settings.env at build time.
          # dotenv does not overwrite variables already present in process.env (override: false by default),
          # so shell/CI env vars always take precedence over the .env file.
          VIEW_ID: NDE
        run: npm run build
        
      - name: Upload NDE zip to Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/01MIT_INST-NDE.zip --clobber
